<div class="form-container">
  <h2>{{ title }}</h2>

  <form *ngIf="usuario" #form="ngForm" (ngSubmit)="onSubmit(form)">
    <!-- NOMBRE -->
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        type="text"
        [(ngModel)]="usuario.nombre"
        name="nombre"
        required
        #nombre="ngModel"
      />
    </div>

    <!-- USUARIO -->
    <div class="form-group">
      <label for="nombreUsuario">Usuario</label>
      <input
        id="nombreUsuario"
        type="text"
        [(ngModel)]="usuario.nombreUsuario"
        name="nombreUsuario"
        required
        #nombreUsuario="ngModel"
      />
    </div>

    <!-- TELÉFONO -->
    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input
        id="telefono"
        type="text"
        [(ngModel)]="usuario.telefono"
        name="telefono"
        required
        pattern="[0-9]{10}"
        #telefono="ngModel"
      />
    </div>

    <!-- CORREO -->
    <div class="form-group">
      <label for="correo">Correo</label>
      <input
        id="correo"
        type="email"
        [(ngModel)]="usuario.correo"
        name="correo"
        required
        email
        #correo="ngModel"
      />
    </div>

    <!-- CONTRASEÑA -->
    <div class="form-group">
      <label for="clave">
        {{ mode === 'create' ? 'Clave (mínimo 6 caracteres)' : 'Nueva Contraseña' }}
      </label>
      <input
        id="clave"
        type="password"
        [(ngModel)]="usuario.clave"
        name="clave"
        [required]="mode === 'create'"
        minlength="6"
        [placeholder]="mode === 'edit' ? 'Ingrese nueva contraseña si desea cambiarla' : ''"
        #claveModel="ngModel"
      />
    </div>

    <!-- ROL -->
    <div class="form-group">
      <label for="idRol">Rol</label>
      <select id="idRol" [(ngModel)]="usuario.idRol" name="idRol" required #rol="ngModel">
        <option [ngValue]="null" disabled>Seleccione un rol</option>
        <option [value]="2">Empleado</option>
        <option [value]="3">Cliente</option>
      </select>
    </div>

    <!-- ERRORES -->
    <div
      class="error"
      *ngIf="
        form.touched || form.dirty || errores.general || errores.nombreUsuario || errores.correo
      "
    >
      <span *ngIf="errores.nombreUsuario">
        {{ errores.nombreUsuario }}
      </span>

      <span *ngIf="!errores.nombreUsuario && errores.correo">
        {{ errores.correo }}
      </span>

      <span *ngIf="!errores.nombreUsuario && !errores.correo && errores.general">
        {{ errores.general }}
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          (nombre.errors?.['required'] ||
            nombreUsuario.errors?.['required'] ||
            telefono.errors?.['required'] ||
            correo.errors?.['required'] ||
            (mode === 'create' && claveModel.errors?.['required']) ||
            rol.errors?.['required'])
        "
      >
        Todos los campos deben estar diligenciados correctamente
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          !nombre.errors?.['required'] &&
          !nombreUsuario.errors?.['required'] &&
          !telefono.errors?.['required'] &&
          telefono.errors?.['pattern']
        "
      >
        El teléfono debe tener 10 dígitos numéricos
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          !nombre.errors?.['required'] &&
          !nombreUsuario.errors?.['required'] &&
          !telefono.errors?.['required'] &&
          !telefono.errors?.['pattern'] &&
          !correo.errors?.['required'] &&
          correo.invalid
        "
      >
        El correo no es válido
      </span>

      <span
        *ngIf="
          !errores.general && usuario.clave && usuario.clave.length > 0 && usuario.clave.length < 6
        "
      >
        La contraseña debe tener al menos 6 caracteres
      </span>
    </div>

    <!-- BOTÓN -->
    <button
      class="btn-save"
      type="submit"
      [disabled]="
        form.invalid ||
        (mode === 'edit' && usuario.clave && usuario.clave.length > 0 && usuario.clave.length < 6)
      "
    >
      {{ buttonLabel }}
    </button>
  </form>
</div>
