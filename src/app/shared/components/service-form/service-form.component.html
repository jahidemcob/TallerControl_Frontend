<div class="form-container">
  <h2>{{ title }}</h2>

  <form #form="ngForm" (ngSubmit)="onSubmit(form)">
    <!-- NOMBRE -->
    <div class="form-group">
      <label for="nombreServicio">{{ 'SERVICES.FORM.NAME' | translate }}</label>
      <input id="nombreServicio" [(ngModel)]="service.nombreServicio" name="nombreServicio" required
        #nombreServicio="ngModel" />
    </div>

    <!-- DESCRIPCIÓN -->
    <div class="form-group">
      <label for="descripcion">{{ 'SERVICES.FORM.DESCRIPTION' | translate }}</label>
      <textarea id="descripcion" [(ngModel)]="service.descripcion" name="descripcion" required rows="3"
        style="height: auto" #descripcion="ngModel"></textarea>
    </div>

    <!-- PRECIO -->
    <div class="form-group">
      <label for="precioBase">{{ 'SERVICES.FORM.BASE_PRICE' | translate }}</label>
      <input id="precioBase" type="number" [(ngModel)]="service.precioBase" name="precioBase" required min="1"
        #precioBase="ngModel" />
    </div>

    <!-- VALIDACIONES FRONT -->
    <div class="error" *ngIf="form.invalid && (form.touched || form.dirty)">
      <span *ngIf="
          nombreServicio.errors?.['required'] ||
          descripcion.errors?.['required'] ||
          precioBase.errors?.['required']
        ">
        {{ 'SERVICES.VALIDATION.REQUIRED_FIELDS' | translate }}
      </span>

      <span *ngIf="
          !nombreServicio.errors?.['required'] &&
          !descripcion.errors?.['required'] &&
          !precioBase.errors?.['required'] &&
          precioBase.errors?.['min']
        ">
        {{ 'SERVICES.VALIDATION.PRICE_MIN' | translate }}
      </span>
    </div>

    <!-- ERROR BACKEND -->
    <div class="error" *ngIf="errores.general || errores.nombreServicio || errores.precioBase">
      <span *ngIf="errores.nombreServicio">{{ errores.nombreServicio }}</span>
      <span *ngIf="errores.precioBase">{{ errores.precioBase }}</span>
      <span *ngIf="errores.general">{{ errores.general }}</span>
    </div>

    <!-- ÉXITO -->
    <div class="success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <!-- BOTÓN -->
    <button class="btn-save" type="submit" [disabled]="form.invalid || loading">
      {{ buttonLabel }}
    </button>
  </form>
</div>
