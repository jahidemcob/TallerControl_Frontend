<div class="dashboard">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <ul>
      <li>
        <button type="button" (click)="ir('/empleado/citas')">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
          >
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="text">Citas</span>
        </button>
      </li>
    </ul>
  </div>

  <!-- CONTENIDO -->
  <div class="main-content">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="profile-box">
        <div class="avatar"></div>
        <span class="username">Empleado</span>
        <button class="arrow" (click)="toggleMenu()">▼</button>
      </div>

      <div class="dropdown" *ngIf="menuAbierto">
        <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <!-- MENSAJE DE BIENVENIDA -->
      <div class="welcome" *ngIf="router.url === '/empleado'">
        <h1>Bienvenido</h1>
        <p>Selecciona una acción en el panel</p>
      </div>

      <!-- CONTENIDO DE RUTAS -->
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
