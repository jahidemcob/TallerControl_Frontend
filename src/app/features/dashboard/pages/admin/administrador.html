<div class="dashboard">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <ul>
      <li>
        <button type="button" (click)="ir('/admin/usuarios')">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M4 21v-2a4 4 0 0 1 3-3.87"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="text">Usuarios</span>
        </button>
      </li>

      <li>
        <button type="button" (click)="ir('/admin/citas')">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
          >
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="text">Citas</span>
        </button>
      </li>

      <li>
        <button type="button" (click)="ir('/admin/servicios')">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span class="text">Servicios</span>
        </button>
      </li>

      <li>
        <button type="button" (click)="ir('/admin/finanzas')">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
          >
            <path d="M3 3v18h18"></path>
            <path d="M7 14l3-3 4 4 5-5"></path>
          </svg>
          <span class="text">Finanzas</span>
        </button>
      </li>
    </ul>
  </div>

  <!-- CONTENIDO -->
  <div class="main-content">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="profile-box">
        <div class="avatar"></div>
        <span class="username">Administrador</span>
        <button class="arrow" (click)="toggleMenu()">▼</button>
      </div>

      <div class="dropdown" *ngIf="menuAbierto">
        <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <!-- MENSAJE DE BIENVENIDA -->
      <div class="welcome" *ngIf="router.url === '/admin'">
        <h1>Bienvenido Administrador/a</h1>
        <p>Selecciona una acción en el panel</p>
      </div>

      <!-- CONTENIDO DE RUTAS -->
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
