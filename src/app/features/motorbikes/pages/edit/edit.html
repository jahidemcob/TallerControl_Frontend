<div class="form-container">
  <h2>Editar Motocicleta</h2>

  <form #form="ngForm" (ngSubmit)="updateService()">
    <!-- MARCA -->
    <div class="form-group">
      <label for="marca">Marca</label>
      <input id="marca" [(ngModel)]="motorbike.marca" name="marca" #marca="ngModel" />
    </div>

    <!-- MODELO -->
    <div class="form-group">
      <label for="modelo">Modelo</label>
      <input id="modelo" [(ngModel)]="motorbike.modelo" name="modelo" #modelo="ngModel" />
    </div>

    <!-- CILINDRAJE -->
    <div class="form-group">
      <label for="cilindraje">Cilindraje</label>
      <input
        id="cilindraje"
        type="number"
        [(ngModel)]="motorbike.cilindraje"
        name="cilindraje"
        min="1"
        #cilindraje="ngModel"
      />
    </div>

    <!-- AÑO -->
    <div class="form-group">
      <label for="anio">Año</label>
      <input
        id="anio"
        type="number"
        [(ngModel)]="motorbike.anio"
        name="anio"
        min="2010"
        #anio="ngModel"
      />
    </div>

    <!-- VALIDACIONES (SIN CAMPOS VACÍOS) -->
    <div class="error" *ngIf="form.touched || form.dirty">
      <span *ngIf="motorbike.cilindraje && cilindraje.errors?.['min']">
        El cilindraje debe ser mayor a 0
      </span>

      <span *ngIf="!cilindraje.errors?.['min'] && motorbike.anio && anio.errors?.['min']">
        El año debe ser mayor a 2009
      </span>
    </div>

    <!-- ERROR BACKEND (FACADE) -->
    <div
      class="error"
      *ngIf="
        errores.general || errores.marca || errores.modelo || errores.cilindraje || errores.anio
      "
    >
      <span *ngIf="errores.marca">{{ errores.marca }}</span>
      <span *ngIf="errores.modelo">{{ errores.modelo }}</span>
      <span *ngIf="errores.cilindraje">{{ errores.cilindraje }}</span>
      <span *ngIf="errores.anio">{{ errores.anio }}</span>
      <span *ngIf="errores.general">{{ errores.general }}</span>
    </div>

    <!-- BOTÓN -->
    <button class="btn-save" type="submit" [disabled]="loading">Actualizar Motocicleta</button>
  </form>
</div>
